<span>
    <mat-form-field class="select-language">
          <mat-select #langSelect
                      [(value)]="langString"
                      (change)="setLanguage($event, langSelect.value.lang)">
            <mat-option *ngFor="let language of languages" [value]="language.lang">{{ language.lang }}</mat-option>
          </mat-select>
    </mat-form-field>
</span>
