<!-- select an existing user to add it to a project
      - if the user doesn't exist yet, create a new one by importing the user form component -->


<h3>{{form.title}}</h3>
<div class="user-panel">
    <div class="select-user">
<!--
        <button md-icon-button class="prefix">
            <md-icon>add</md-icon>
        </button>
-->
        <md-input-container class="full-width">

            <input mdInput
                   [mdAutocomplete]="auto"
                   [formControl]="userCtrl"
                   [placeholder]="form.select">
        </md-input-container>

        <button md-icon-button class="suffix" (click)="userCtrl.reset()" *ngIf="userCtrl.value && userCtrl.dirty">
            <md-icon>close</md-icon>
        </button>

        <md-autocomplete #auto="mdAutocomplete">
            <md-option *ngFor="let user of reactiveUsers | async" [value]="user?.name">
                {{ user?.name }}
            </md-option>
        </md-autocomplete>
    </div>

    <div class="linebreak">
        {{form.or}}
    </div>

    <div class="add-user">
        <button md-raised-button (click)="openUserForm()">
            {{form.create}}
        </button>
    </div>
</div>
