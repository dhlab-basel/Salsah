<form class="salsah-form new-user" [formGroup]="uf" (ngSubmit)="onSubmit(uf.value, uf.valid)">

    <!-- select an existing user to add it to a project
      - if the user doesn't exist yet, create a new one with the new user form component below -->

    <!-- we need the select user (autocomplete list) to add an existing user to an existing project -->
    <section class="select-user" *ngIf="iri">
        <h4>{{form.subtitle}}</h4>
        <md-input-container class="full-width">
            <input mdInput
                   [mdAutocomplete]="users"
                   [formControl]="userCtrl"
                   [placeholder]="form.select">
            <md-icon mdSuffix class="salsah-link" (click)="userCtrl.reset()" *ngIf="userCtrl.value && userCtrl.dirty">
                close
            </md-icon>
        </md-input-container>
        <md-autocomplete #users="mdAutocomplete" [displayWith]="displayFn">
            <md-option *ngFor="let user of reactiveUsers | async" [value]="user" (onSelectionChange)="getUser(user?.iri)">
                {{ user?.name }}
            </md-option>
        </md-autocomplete>

        <div class="linebreak">OR</div>

    </section>

    <!-- form to create a new user or to edit an old one from selection above -->
    <section class="add-user">

        <table class="full-width" cellspacing="0">
            <!-- line 1: pre and last name -->
            <tr>
                <td colspan="1">
                    <md-input-container class="full-width"
                                        dividerColor="{{ uf.controls['givenName']?.invalid && uf.controls['givenName']?.touched ? 'warn' : 'primary' }}">
                        <input mdInput
                               [placeholder]="form.user.givenName + ' *'"
                               [formControl]="uf.controls['givenName']">
                    </md-input-container>
                </td>
                <td colspan="2">
                    <md-input-container class="full-width"
                                        dividerColor="{{ uf.controls['familyName']?.invalid && uf.controls['familyName']?.touched ? 'warn' : 'primary' }}">
                        <input mdInput
                               [placeholder]="form.user.familyName + ' *'"
                               [formControl]="uf.controls['familyName']">
                    </md-input-container>
                </td>
            </tr>
            <!-- line 2: eMail address -->
            <tr>
                <td colspan="3">
                    <md-input-container class="full-width"
                                        dividerColor="{{ uf.controls['email']?.invalid && uf.controls['email']?.touched ? 'warn' : 'primary' }}">
                        <input mdInput type="email"
                               [placeholder]="form.user.email + ' *'"
                               [formControl]="uf.controls['email']">
                        <md-hint class="salsah-hint">
                            <span [hidden]="uf.controls['email'].invalid">{{form.user.emailHint}}</span>
                            <span
                                [hidden]="uf.controls['email'].valid && uf.controls['email'].dirty || !uf.controls['email'].touched"
                                class="salsah-error">{{form.user.emailValidation}}
                                </span>
                        </md-hint>
                    </md-input-container>
                </td>
            </tr>
            <!-- line 3: password -->
            <tr>
                <td colspan="3">
                    <md-input-container class="full-width"
                                        dividerColor="{{ !uf.controls['password']?.valid ? 'warn' : 'primary' }}">
                        <input mdInput type="password"
                               [placeholder]="form.user.password + ' *'"
                               [formControl]="uf.controls['password']">
                        <md-hint class="salsah-hint">
                            <!-- [hidden]="uf.controls['password'].valid" [ngClass]="{'salsah-error': (uf.controls['password'].invalid && uf.controls['password'].dirty)}"  -->
                            <span
                                [hidden]="uf.controls['password'].valid && uf.controls['password'].dirty || uf.controls['password'].touched"
                                class="salsah-error">
                                    {{form.user.passwordHint}}
                                </span>
                        </md-hint>
                    </md-input-container>
                </td>
            </tr>
            <!-- line 4: preferred language -->
            <tr>
                <td colspan="3">
                    <md-select [formControl]="uf.controls['lang']" [placeholder]="form.user.language"
                               [(ngModel)]="uf.controls['lang'].value">
                        <md-option value="en">english</md-option>
                        <md-option value="de">deutsch</md-option>
                        <md-option value="fr">français</md-option>
                        <md-option value="it">italiano</md-option>
                    </md-select>
                </td>
            </tr>
            <!-- line 5: permissions: groups and administrative permissions -->
            <tr>
                <td>
                    {{form.permissions.group}}
                </td>
                <td>
                    {{form.permissions.admin}}
                </td>
                <td>
                    {{form.system.admin}}
                    <md-slide-toggle [color]="'primary'" [formControl]="uf.controls['systemAdmin']" [(ngModel)]="uf.controls['systemAdmin'].value">

                    </md-slide-toggle>
                </td>
            </tr>

        </table>
    </section>

    <div class="form-footer">
        <button md-raised-button
                class="submit-button center"
                color="primary"
                [disabled]="!uf.valid">
            Save
        </button>
    </div>


</form>
