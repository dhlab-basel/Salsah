<div *ngIf="!isLoading && !errorMessage; else errorMsg">
    <mat-horizontal-stepper [linear]="isLinear" #stepper="matHorizontalStepper">
        <!--
            1.  add' or 'create new' user starts always with the user's email address;
                it's an auto complete form, which checks, if the user already exists
        -->

        <mat-step [stepControl]="firstFormGroup">
            <form [formGroup]="firstFormGroup" class="salsah-form-content">
                <ng-template matStepLabel>Start with username</ng-template>

                <!-- auto complete list to select user -->
                <mat-form-field class="large">
                    <input matInput
                           [matAutocomplete]="user"
                           [formControl]="firstFormGroup.controls['username']"
                           [placeholder]="'salsahLabels.userFormLabels.user.select.autoComplete' | translate">
                    <!--
                    <button mat-button matSuffix mat-icon-button aria-label="Clear"
                            *ngIf="firstFormGroup.controls['username'].dirty"
                            (click)="resetSelected(firstFormGroup.controls['username'])">
                        <mat-icon>close</mat-icon>
                    </button>
                    -->
                    <button mat-button matSuffix matStepperNext [disabled]="!firstFormGroup.valid">
                        Next
                    </button>

                    <mat-autocomplete #user="matAutocomplete">
                        <mat-option *ngFor="let user of filteredUsers | async"
                                    [value]="user?.name"
                                    (onSelectionChange)="setSelected(user)">
                            {{ user?.label }}
                        </mat-option>
                    </mat-autocomplete>

                    <mat-hint *ngIf="firstFormErrors.username">
                        {{ firstFormErrors.username }}
                    </mat-hint>
                </mat-form-field>

            </form>
        </mat-step>

        <mat-step [stepControl]="secondFormGroup">
                <ng-template matStepLabel>User data</ng-template>

                <!-- user data form:
                    a) editable form in case of existing user
                    b) empty in case of unknown eMail = the user doesn't exist yet
                -->


                    <salsah-user-data *ngIf="firstFormGroup.valid" [username]="firstFormGroup.controls['username'].value"></salsah-user-data>



                <div>
                    <button mat-button matStepperPrevious>Back</button>
                    <button mat-button matStepperNext>Next</button>
                </div>

        </mat-step>
        <!--
        <mat-step [stepControl]="thirdFormGroup">
            <form [formGroup]="thirdFormGroup">
                <ng-template matStepLabel>User role</ng-template>
            </form>
        </mat-step>
        -->
        <mat-step>
            <ng-template matStepLabel>Done</ng-template>
            You are now done.
            <div>
                <button mat-button matStepperPrevious>Back</button>
                <button mat-button (click)="stepper.reset()">Reset</button>
            </div>
        </mat-step>
    </mat-horizontal-stepper>
</div>

<!-- in the case of an API error: show the error message -->
<ng-template #errorMsg>
    <salsah-message *ngIf="errorMessage" [message]="errorMessage"></salsah-message>
</ng-template>




<!--
 the user form is a step by step form, which will be used in system and project admin
 to create new user, to edit existing users or/and to add user to or remove from projects

 the steps (depending on the usage / route) are as follow:
    1) user profile
        a) in case of project admin: select existing user OR create new user profile => b)
        b) in case of system and project admin: create new user profile and edit old one

    2) project membership
        a) in case of system admin: select project AND set the permissions => b)
        b) in case of project and system admin: set permissions incl. system permissions (if the logged in user is sys admin)

    3) special stuff like "add the user to system project" and set system permissions

-->
