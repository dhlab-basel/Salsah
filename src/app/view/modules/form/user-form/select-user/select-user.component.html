<form class="salsah-form-content" *ngIf="!isLoading">
    <mat-form-field class="full-width">
        <input matInput
               [matAutocomplete]="user"
               [formControl]="form.controls['username']"
               [placeholder]="'salsahLabels.userFormLabels.user.select.autoComplete' | translate">
        <mat-icon matSuffix
                  class="input-icon"
                  (click)="resetSelected(form.controls['username'])">
            <!--
                  *ngIf="formErrors.value && userCtrl.dirty">
                  -->
            close
        </mat-icon>
        <button mat-button matSuffix
                class="navigation-button"
                color="primary"
                (click)="nextStep($event)"
                [disabled]="!form.valid">
            {{ 'salsahLabels.userFormLabels.navigation.next' | translate }}
        </button>
        <mat-autocomplete #user="matAutocomplete">
            <mat-option *ngFor="let user of filteredUsers | async"
                        [value]="user?.name"
                        (onSelectionChange)="setSelected(user)">
                {{ user?.label }}
            </mat-option>
        </mat-autocomplete>
    </mat-form-field>
</form>
