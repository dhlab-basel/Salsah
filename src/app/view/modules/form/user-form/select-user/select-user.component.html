<mat-expansion-panel [expanded]="expanded"
                     (opened)="isActive(0)"
                     [hideToggle]="true">

    <!-- header -->
    <mat-expansion-panel-header>

        <mat-panel-title>
            <span *ngIf="!selectedUser">{{ 'salsahLabels.userFormLabels.user.select.title' | translate }}</span>
            <span *ngIf="selectedUser">{{ 'salsahLabels.userFormLabels.user.select.titleDone' | translate }}</span>
        </mat-panel-title>

        <mat-panel-description>
            <span *ngIf="!selectedUser">{{'salsahLabels.userFormLabels.user.select.description' | translate }}</span>
            <span *ngIf="selectedUser"><i>{{selectedUser}}</i></span>
            <mat-icon>person</mat-icon>
        </mat-panel-description>

    </mat-expansion-panel-header>

    <!-- content -->
    <mat-form-field class="large">
        <input matInput
               [placeholder]="'salsahLabels.userFormLabels.user.select.autoComplete' | translate"
               [matAutocomplete]="autoUser"
               [formControl]="userCtrl">
        <mat-icon matSuffix
                  class="input-icon icon-for-autocomplete"
                  (click)="resetSelectedUser()"
                  *ngIf="userCtrl.value && userCtrl.dirty">
            close
        </mat-icon>
        <mat-autocomplete #autoUser="matAutocomplete"> <!-- [displayWith]="displayFn"> -->
            <mat-option *ngFor="let user of filteredUsers | async" [value]="user?.name"
                        (onSelectionChange)="setSelectedUser(user)">
                {{ user?.name }}
            </mat-option>
        </mat-autocomplete>
    </mat-form-field>

    <!-- footer with action buttons -->
    <mat-action-row>
        <button mat-button *ngIf="!selectedUser"
                class="navigation-button left"
                color="warn"
                (click)="navigate($event, 'skip')">
            {{ 'salsahLabels.userFormLabels.user.select.skip' | translate }}
        </button>
        <button mat-button *ngIf="project"
                class="navigation-button"
                color="primary"
                (click)="navigate($event, 'next')"
                [disabled]="!userCtrl.valid">
            {{ 'salsahLabels.userFormLabels.user.select.next' | translate }}
        </button>
        <button mat-button *ngIf="!project"
                class="navigation-button"
                color="primary"
                (click)="navigate($event, 'skip')"
                [disabled]="!userCtrl.valid">
            {{ 'salsahLabels.userFormLabels.user.select.next' | translate }}
        </button>
    </mat-action-row>

</mat-expansion-panel>
