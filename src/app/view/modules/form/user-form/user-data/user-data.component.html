    <salsah-progress-indicator *ngIf="isLoading"></salsah-progress-indicator>
    <!-- content -->
    <form *ngIf="!isLoading" [formGroup]="userDataForm" class="salsah-form-content user-data">

        <!-- email = username -->
        <mat-form-field class="large">
            <input matInput type="email"
                   [formControl]="userDataForm.controls['email']"
                   placeholder="{{ 'salsahLabels.userFormLabels.user.create.email' | translate}} *">
        </mat-form-field>

        <!-- given name -->
        <mat-form-field class="small">
            <input matInput
                   [formControl]="userDataForm.controls['givenName']"
                   placeholder="{{ 'salsahLabels.userFormLabels.user.create.givenName' | translate}} *">
            <mat-hint *ngIf="formErrors.givenName">
                {{ formErrors.givenName }}
            </mat-hint>
        </mat-form-field>

        <!-- family name -->
        <mat-form-field class="medium">
            <input matInput
                   [formControl]="userDataForm.controls['familyName']"
                   placeholder="{{ 'salsahLabels.userFormLabels.user.create.familyName' | translate}} *">
            <mat-hint *ngIf="formErrors.familyName">
                {{ formErrors.familyName }}
            </mat-hint>
        </mat-form-field>

        <!-- password -->
        <mat-form-field class="large">
            <input matInput [type]="showPassword ? 'text' : 'password'"
                   [formControl]="userDataForm.controls['password']"
                   placeholder="{{ 'salsahLabels.userFormLabels.user.create.password' | translate}} *">
            <mat-icon matSuffix class="input-icon icon-for-password" (click)="toggleVisibility()"
                      [innerHtml]="showPassword ? 'visibility_off' :'visibility'"></mat-icon>
            <mat-hint *ngIf="formErrors.password">
                {{ formErrors.password }}
            </mat-hint>
        </mat-form-field>

        <mat-select class="large"
                    [formControl]="userDataForm.controls['lang']"
                    [placeholder]="'salsahLabels.userFormLabels.user.create.language' | translate">
            <mat-option value="en">english</mat-option>
            <mat-option value="de">deutsch</mat-option>
            <mat-option value="fr">français</mat-option>
            <mat-option value="it">italiano</mat-option>
        </mat-select>

    </form>
