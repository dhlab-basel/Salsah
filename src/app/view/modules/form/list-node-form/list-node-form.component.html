<h2 md-dialog-title>List Node Details</h2>

<form [formGroup]="listNodeInfoForm" novalidate>

    <md-dialog-content>
        <md-input-container class="list-item-full-width">
            <input mdInput placeholder="Id" formControlName="id">
        </md-input-container>

        <div>
            <h4>Labels</h4> <button md-button (click)="addLabel()">Add Label</button>
        </div>

        <div *ngIf="labels" formArrayName="labels">
            <div *ngFor="let label of labels.controls; let i=index" [formGroupName]="i">
                <div class="flex align-center">
                    <md-input-container class="list-item-full-width">
                        <input mdInput placeholder="Value" formControlName="value">
                    </md-input-container>

                    <select formControlName="lang" class="flex-one">
                        <option value="" disabled>Select language</option>
                        <option value="en">en</option>
                        <option value="de">de</option>
                        <option value="fr">fr</option>
                        <option value="it">it</option>
                    </select>
                </div>
            </div>
        </div>

        <div>
            <h4>Comments</h4> <button md-button (click)="addComment()">Add Comment</button>
        </div>

        <div *ngIf="comments" formArrayName="comments">
            <div *ngFor="let comment of comments.controls; let i=index" [formGroupName]="i">
                <div class="flex align-center">
                    <md-input-container class="list-item-full-width">
                        <input mdInput placeholder="Value" formControlName="value">
                    </md-input-container>

                    <select formControlName="lang" class="flex-one">
                        <option value="" disabled>Select language</option>
                        <option value="en">en</option>
                        <option value="de">de</option>
                        <option value="fr">fr</option>
                        <option value="it">it</option>
                    </select>
                </div>
            </div>
        </div>
    </md-dialog-content>

    <md-dialog-actions>

        <button md-raised-button
                (click)="save(listNodeInfoForm.value)"
                [disabled]="listNodeInfoForm.pristine"
                class="btn btn-success">
            Save
        </button> &nbsp;

        <button md-raised-button
                (click)="revert()"
                [disabled]="listNodeInfoForm.pristine"
                class="btn btn-danger">
            Revert
        </button> &nbsp;

        <button md-raised-button
                md-dialog-close>
            Close
        </button> &nbsp;

        <button md-raised-button
                [md-dialog-close]="true">
            Save
        </button>
    </md-dialog-actions>

</form>

<hr/>
