<h2 md-dialog-title>List Node Details</h2>

<md-dialog-content>
    <div *ngIf="currentListNodeInfo">
        <h5><label>id: </label>{{currentListNodeInfo.id}}</h5>
        <md-list-item *ngFor="let label of currentListNodeInfo.labels">
            <h5 md-line><label>lang xxx:</label> {{label}}</h5>
        </md-list-item>
        <h5><label>comment: </label>{{currentListNodeInfo.comment}}</h5>
        <br/>
    </div>
</md-dialog-content>

<md-dialog-actions>
    <button md-button md-dialog-close>Cancel</button>
    <!-- Can optionally provide a result for the closing dialog. -->
    <button md-button [md-dialog-close]="true">Save</button>
</md-dialog-actions>
