<!------------------------------------Edit lists!    ------------------------------------------------>
<!------------------------------------------------------------------------------------------------------->
<salsah-progress-indicator *ngIf="isLoading"></salsah-progress-indicator>
<section class="salsah-form-content" *ngIf="!isLoading">
    <!------------------------------------------------------------------------------------------------------->
    <!-----------Here we will use expansion panels for each node, which will be collapsible------------------>
    <!-----------Each expansion panels will have its own save button----------------------------------------->
    <h5>{{editLists.label}}</h5>

    <mat-expansion-panel class="full-width" [expanded]="true">
        <mat-expansion-panel-header>
            <mat-panel-title>
                <!--<span>{{ listInfoForm.get('labels').value }} </span>-->
            </mat-panel-title>
            <mat-panel-description>
                <span>{{editLists.description}}</span>
            </mat-panel-description>
        </mat-expansion-panel-header>
        <form class="salsah-form new-user" [formGroup]="listInfoForm">


            <h4>Labels</h4>
            <span *ngIf="labels" formArrayName="labels">
                                   <div *ngFor="let label of labels.controls; let i=index" [formGroupName]="i">
                                       <mat-form-field class="width-80">
                                           <input matInput
                                                  placeholder="Value"
                                                  formControlName="value">
                                       </mat-form-field>
                                       <mat-form-field class="width-10">
                                           <mat-select formControlName="language">
                                               <mat-option value="" disabled>Select language</mat-option>
                                               <mat-option value="en">en</mat-option>
                                               <mat-option value="de">de</mat-option>
                                               <mat-option value="fr">fr</mat-option>
                                               <mat-option value="it">it</mat-option>
                                               <!--<mat-option *ngFor="let label of labels.controls" [value]="label.get('language').value">-->
                                               <!--{{label.get('language').value}}-->
                                               <!--</mat-option>-->
                                           </mat-select>
                                       </mat-form-field>
                                   </div>
                               <button mat-button
                                       class="right"
                                       [color]="'primary'"
                                       (click)="addLabel()">
                                   Add Label
                               </button>
                               </span>


            <h4>Comments</h4>
            <div *ngIf="comments" formArrayName="comments">
                <div *ngFor="let comment of comments.controls; let i=index" [formGroupName]="i">
                    <mat-form-field class="width-80">
                        <input matInput
                               placeholder="Value"
                               formControlName="value">
                    </mat-form-field>
                    <mat-form-field class="width-10">
                        <mat-select formControlName="language">
                            <mat-option value="" disabled>Select language</mat-option>
                            <mat-option value="en">en</mat-option>
                            <mat-option value="de">de</mat-option>
                            <mat-option value="fr">fr</mat-option>
                            <mat-option value="it">it</mat-option>
                        </mat-select>
                    </mat-form-field>
                </div>
                <button mat-button
                        class="right"
                        [color]="'primary'"
                        (click)="addComment()">
                    Add Comment
                </button>
            </div>


            <mat-form-field class="full-width">
                <input matInput
                       [placeholder]=editLists.list.id
                       formControlName="id">
            </mat-form-field>
            <mat-form-field class="full-width">
                <input matInput
                       [placeholder]=editLists.list.project
                       formControlName="belongsToProject">
            </mat-form-field>
            <div formArrayName="comments">
                <mat-form-field class="full-width" *ngFor="let comment of comments.controls; let j=index"
                                [formGroupName]="j">
                    <input matInput
                           [placeholder]=editLists.list.comments
                           formControlName="value">
                </mat-form-field>
            </div>

            <mat-action-row>
                <button mat-button
                        color="warn"
                        (click)="revertListInfo()">
                    {{editLists.buttons.reset}}
                </button>
                <button mat-raised-button
                        class="save-button"
                        [color]="'primary'"
                        [disabled]="!listInfoForm.valid"
                        (click)="saveNode(listInfoForm.value)">
                    {{editLists.buttons.save}}
                </button>
            </mat-action-row>
        </form>
    </mat-expansion-panel>
</section>
