
<section *ngIf="!editResource" >
    <h3>{{resType.label}}</h3>
    <p >{{resType.description}}</p>
        <md-list class="list-group" mdTooltip="You can sort this list with drag and drop" dnd-sortable-container [sortableData]="resType.properties">
            <md-list-item *ngFor="let prop of resType.properties; let i = index" class="list-group-item" dnd-sortable [sortableIndex]="i">
                <h4 md-line>{{prop.label}}</h4>
                <p md-line>{{prop.description}}</p>
                <p md-line>{{prop.occurence}} | {{prop.gui_name}}</p>
            </md-list-item>
        </md-list>
    <md-divider></md-divider>
        <p class="mute">My classes:<br/>
        <span *ngFor="let prop of resType.properties; let i = index">{{i + 1}}) {{prop.label}}<br/></span>

</section>

<!------------------------------------------------------------------------------------------------------->
<!------------------------------------Edit resources!    ------------------------------------------------>
<!------------------------------------------------------------------------------------------------------->

<section *ngIf="editResource" >
    <h4>Click on the fields to edit</h4>

<!------------------------------------------------------------------------------------------------------->
<!-----------Here we will use cards for each resource and property, which will be collapsible------------>
<!-----------Each card will have its own save button----------------------------------------------------->

    <h4>Resource</h4>
    <md-card>
        <form #editRes="ngForm" (ngSubmit)="onSubmit(editRes.value)" class="salsah-form">
            <md-card-content>
                    <p><md-input-container class = "full-width">
                            <input mdInput
                                   placeholder="Resource Type"
                                   name="name"
                                   [(ngModel)]="resType.label"
                                    value="{{resType.label}}">
                    </md-input-container></p>

                    <p><md-input-container class = "full-width">
                        <textarea mdInput
                                  placeholder="Resource Description"
                                  name="description"
                                  [(ngModel)]="resType.description">
                            {{resType.description}}
                        </textarea>
                    </md-input-container></p>
            </md-card-content>

            <md-card-actions>
                <button md-raised-button
                        class="save-button"
                        [color]="'primary'"
                        type="submit">
                    Save
                </button>
            </md-card-actions>
        </form>
    </md-card>


<!------------------------------------Edit resource properties!  We use tabs  ------------------------------------------------>
<br>
    <h4>Properties</h4>
    <md-divider></md-divider>
    <md-tab-group >
        <md-tab *ngFor="let prop of resType.properties; let i = index" label="{{prop.label}}">
            <br>
            <form #editProp="ngForm" (ngSubmit)="onSubmit(editProp.value)" class="salsah-form">
                <md-input-container class = "full-width" *ngIf="resType.properties[i] !== undefined" >
                    <input mdInput
                           placeholder="Property name"
                           name="propertyName"
                           [id]="prop.label"
                           [(ngModel)]="prop.label"
                           [value]="prop.label">
                </md-input-container>
                <md-input-container class = "full-width" *ngIf="resType.properties[i] !== undefined" >
                    <input mdInput
                           placeholder="Property description"
                           name="propDescription"
                           [id]="prop.description"
                           [(ngModel)]="prop.description"
                           [value]="prop.description">
                </md-input-container>
                <md-input-container class = "full-width" *ngIf="resType.properties[i] !== undefined" >
                    <input mdInput
                           placeholder="GUI type"
                           name="guiType"
                           [id]="prop.gui_name"
                           [(ngModel)]="prop.gui_name"
                           [value]="prop.gui_name">
                </md-input-container>
                <md-input-container class = "full-width" *ngIf="resType.properties[i] !== undefined" >
                    <input mdInput
                           placeholder="Attributes"
                           name="attributes"
                           [id]="prop.attributes"
                           [(ngModel)]="prop.attributes"
                           [value]="prop.attributes">
                </md-input-container>
                <md-input-container class = "full-width" *ngIf="resType.properties[i] !== undefined" >
                    <input mdInput
                           placeholder="Id"
                           name="id"
                           [id]="prop.id"
                           [(ngModel)]="prop.id"
                           disabled value="prop.id">
               </md-input-container>
                <md-input-container class = "full-width" *ngIf="resType.properties[i] !== undefined" >
                    <input mdInput
                           placeholder="Occurence"
                           name="occurence"
                           [id]="prop.occurence"
                           [(ngModel)]="prop.occurence"
                           [value]="prop.occurence">
                </md-input-container>
                <md-input-container class = "full-width" *ngIf="resType.properties[i] !== undefined" >
                    <input mdInput
                           placeholder="Value type id"
                           name="valuetype_id"
                           [id]="prop.valuetype_id"
                           [(ngModel)]="prop.valuetype_id"
                           disabled value="prop.valuetype_id">
                </md-input-container>
                <md-input-container class = "full-width" *ngIf="resType.properties[i] !== undefined" >
                    <input mdInput
                           placeholder="Vocabulary"
                           name="vocabulary"
                           [id]="prop.vocabulary"
                           [(ngModel)]="prop.vocabulary"
                           [value]="prop.vocabulary">
                </md-input-container>
                <button md-raised-button
                        class="save-button"
                        [color]="'primary'"
                        type="submit">
                    Save
                </button>
            </form>
        </md-tab>
    </md-tab-group>

</section>

<footer class="footer">
    <div *ngIf="!editResource" layout="row" layout-align="center center" flex>
        <button md-raised-button
                class="next"
                [color]="'primary'"
                (click)="editResources()">
            Edit
        </button>
    </div>
    <div *ngIf="editResource" layout="row" layout-align="center center" flex>
        <button md-raised-button
                class="next"
                [color]="'primary'"
                (click)="closeEditView()">
            Close
        </button>
    </div>
</footer>
