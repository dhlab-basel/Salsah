{{diagnostic}}

<md-card>

    <md-card-title>List Details</md-card-title>

    <md-card-content>
        <form #listInfoForm="ngForm" class="list-form">

            <md-input-container class="list-item-full-width">
                <input mdInput placeholder="Id" [(ngModel)]="currentListInfo.id">
            </md-input-container>

            <md-input-container class="list-item-full-width">
                <input mdInput placeholder="Project" [(ngModel)]="currentListInfo.projectIri">
            </md-input-container>

            <md-input-container class="list-item-full-width">
                <input mdInput placeholder="Label" [(ngModel)]="currentListInfo.label">
            </md-input-container>

            <md-input-container class="list-item-full-width">
                <input mdInput placeholder="Comment" [(ngModel)]="currentListInfo.comment">
            </md-input-container>

            <button type="submit" class="btn btn-success">Submit</button>

        </form>

    </md-card-content>
</md-card>






<div *ngIf="currentListInfo">
    <h2>{{currentListInfo.label}} details!</h2>
    <div><label>id: </label>{{currentListInfo.id}}</div>
    <div><label>project: </label>{{currentListInfo.projectIri}}</div>
    <div><label>label: </label>{{currentListInfo.label}}</div>
    <div><label>comment: </label>{{currentListInfo.comment}}</div>
    <tree-root [nodes]="currentNodes">
        <ng-template #treeNodeTemplate let-node let-index="index">
            <span>{{ node.data.label }}</span>
            <button (click)="viewDetails(node.data.id)">Details</button>
        </ng-template>
    </tree-root>
</div>

<footer class="footer">
    <div layout="row" layout-align="center center" flex>
        <button md-raised-button
                class="next"
                [color]="'primary'"
                (click)="editResources()">
            Edit
        </button>
    </div>
    <div *ngIf="editResource" layout="row" layout-align="center center" flex>
        <button md-raised-button
                class="save-button"
                [color]="'primary'"
                (click)="onSubmit(editRes.value)">
            Save
        </button>
    </div>
</footer>
