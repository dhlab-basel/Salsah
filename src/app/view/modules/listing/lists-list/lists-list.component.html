<!-- progress indicator while the data is loading -->
<salsah-progress-indicator *ngIf="isLoading && !errorMessage"></salsah-progress-indicator>

<!-- in the case of an API error: show the error message -->
<salsah-message *ngIf="errorMessage" [message]="errorMessage"></salsah-message>

<!-- if we have the data: show the list-->
<div *ngIf="listCount > 0; else noData">

    <mat-accordion>
        <mat-expansion-panel *ngFor="let item of lists; let i = index" [hideToggle]="true"
                             (opened)="fetchListData(item.id)">
            <mat-expansion-panel-header>
                <mat-panel-title>
                    <h4>{{item.labels[0].value}}</h4>
                </mat-panel-title>
                <mat-panel-description>
                    {{item.id}}
                    <mat-icon>list</mat-icon>
                </mat-panel-description>
            </mat-expansion-panel-header>

            <h4>Nodes</h4>
            <salsah-progress-indicator *ngIf="isLoadingNodes"></salsah-progress-indicator>
            <!--TODO: this has to be programmed into a loop that goes on continually until there are no more subnodes...-->
            <mat-accordion>
                <mat-expansion-panel *ngFor="let node of currentNodes" [hideToggle]="node.children.length === 0">
                    <mat-expansion-panel-header>
                        <mat-panel-title>
                            {{node.name}}
                        </mat-panel-title>
                        <mat-panel-description *ngIf="node.children.length != 0">
                            Number of sub-nodes: {{node.children.length}}
                        </mat-panel-description>
                    </mat-expansion-panel-header>
                    <mat-accordion>
                        <mat-expansion-panel *ngFor="let subnode of node.children"
                                             [hideToggle]="subnode.children.length === 0">
                            <mat-expansion-panel-header>
                                <mat-panel-title>
                                    {{subnode.name}}
                                </mat-panel-title>
                                <mat-panel-description *ngIf="subnode.children.length != 0">
                                    Number of sub-nodes: {{subnode.children.length}}
                                </mat-panel-description>
                            </mat-expansion-panel-header>
                            <mat-list>
                                <mat-list-item *ngFor="let subnode2 of subnode.children">
                                    {{subnode2.name}}
                                </mat-list-item>
                            </mat-list>
                        </mat-expansion-panel>
                    </mat-accordion>
                </mat-expansion-panel>
            </mat-accordion>

            <mat-action-row>
                <button mat-button
                        color="primary"
                        (click)="toggle(item?.id, i)">
                    edit
                </button>
            </mat-action-row>
            <!--            <mat-action-row>
                            <button mat-button
                                    color="primary"
                                    (click)="edit(item?.id)">
                                edit
                            </button>
                        </mat-action-row>
            -->
        </mat-expansion-panel>

    </mat-accordion>


</div>

<!-- if there are any data: show a no data message -->
<ng-template #noData>
    <salsah-message *ngIf="!isLoading && !errorMessage" [message]="noDataMessage"></salsah-message>
</ng-template>
