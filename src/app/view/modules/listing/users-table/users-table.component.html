<table>
    <tr>
        <th></th>
        <th (click)="sortKey='firstname'" class="salsah-link">Firstname</th>
        <th (click)="sortKey='lastname'" class="salsah-link">Lastname</th>
        <th (click)="sortKey='email'" class="salsah-link">eMail</th>
        <th></th>
    </tr>
    <tr *ngFor="let u of users | sortBy: sortKey; let i = index">
        <td>
            <md-icon md-list-avatar>
                <img salsahGravatar [email]="u?.email" class="salsah-avatar-image"/>
            </md-icon>
        </td>
        <td>{{u?.firstname}}</td>
        <td>{{u?.lastname}}</td>
        <td>{{u?.email}}</td>
        <td>
            <button md-icon-button>
                <md-icon (click)="open(u?.user_id)">
                    info_outline
                </md-icon>
            </button>
        </td>
    </tr>
</table>
