<div>
    Extended Search Form:
    <div>
        <select-ontology *ngIf="ontologies.length > 0" [ontologies]="ontologies" (ontologySelected)="getResourceClassesAndPropertiesForOntology($event)"></select-ontology>
    </div>

    <div *ngIf="resourceClasses?.length > 0">
        <select-resource-class #resourceClass [setResourceClasses]="resourceClasses" (resourceClassSelectedEvent)="getPropertiesForResourceClass($event)"></select-resource-class>
    </div>

    <div *ngIf="properties !== undefined">
        <select-property #property [setProperties]="properties"></select-property>
    </div>

    <button (click)="performExtendedSearch()">Perform search</button>
</div>
