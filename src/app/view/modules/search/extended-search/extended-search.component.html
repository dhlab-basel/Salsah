<div>
    Extended Search Form:
    <div>
        <select-graph *ngIf="ontologies.length > 0" [namedGraphs]="ontologies" (namedGraphSelected)="getClassesAndPropertiesForOntology($event)"></select-graph>
    </div>

    <div *ngIf="resourceClasses?.length > 0">
        <select-class [setResourceClasses]="resourceClasses" (resourceClassSelected)="getPropertiesForClass($event)"></select-class>
    </div>

    <div *ngIf="properties !== undefined">
        <select-property #property [setProperties]="properties"></select-property>
    </div>

    <button (click)="performExtendedSearch()">Perform search</button>
</div>
