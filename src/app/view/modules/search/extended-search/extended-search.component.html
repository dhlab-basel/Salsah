<form (ngSubmit)="submit()">
    Extended Search Form:
    <div>
        <select-ontology *ngIf="ontologies.length > 0" [ontologies]="ontologies" (ontologySelected)="getResourceClassesAndPropertiesForOntology($event)"></select-ontology>
    </div>

    <div *ngIf="resourceClasses?.length > 0">
        <select-resource-class #resourceClass [resourceClasses]="resourceClasses" (resourceClassSelectedEvent)="getPropertiesForResourceClass($event)"></select-resource-class>
    </div>

    <div *ngIf="properties !== undefined">
        <select-property #property [properties]="properties"></select-property>
        <!-- make a button to add more properties to be combined with a logical AND -->
    </div>

    <button type="submit">Perform search</button>
</form>
