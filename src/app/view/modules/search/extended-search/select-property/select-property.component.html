<mat-form-field *ngIf="properties !== undefined">
    <mat-select placeholder="Properties" (change)="propertyChosen($event)">
        <mat-option *ngFor="let prop of propertiesAsArray" [value]="prop.id">{{ prop.label }}</mat-option>
    </mat-select>
</mat-form-field>
