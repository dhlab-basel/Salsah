<mat-form-field *ngIf="property !== undefined">
    <mat-select placeholder="Comparison Operator" [formControl]="form.controls['comparisonOperator']">
        <mat-option [value]="'EQ'">Equals</mat-option>
    </mat-select>
</mat-form-field>

<mat-form-field>
    <input matInput [formControl]="form.controls['propertyValue']" placeholder="Prop value" value="">
</mat-form-field>
