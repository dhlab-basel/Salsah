<div [ngSwitch]="type">
    <div *ngSwitchCase="'submit'"
         class="submit-progress-indicator">
        <!-- spinner while on load -->
        <div class="spinner" *ngIf="status === 0">
            <div class="spinner-icon"></div>
        </div>

        <button md-icon-button class="spinner-done">
            <!-- bullet point before submit -->
            <!--
            <md-icon *ngIf="status === -1">keyboard_arrow_right</md-icon>
            -->
            <md-icon *ngIf="status === -1">check</md-icon>
            <!-- icon 'check' when done -->
            <md-icon *ngIf="status === 1" [color]="'primary'">done</md-icon>
            <!-- in case of an error -->
            <md-icon *ngIf="status === 400" [color]="'warn'">failed</md-icon>
        </button>


    </div>
    <div *ngSwitchCase="'loading'"
         class="loading-progress-indicator">
        <span class="text">{{text}}</span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
    </div>

    <!-- default case: is loading -->
    <div *ngSwitchDefault
         class="default-progress-indicator">
        <div class="line">
            <div class="bounce1"></div>
            <div class="bounce2"></div>
            <div class="bounce3"></div>
        </div>
        <div class="line">
            <div class="bounce3"></div>
            <div class="bounce1"></div>
            <div class="bounce2"></div>
        </div>
    </div>

</div>
