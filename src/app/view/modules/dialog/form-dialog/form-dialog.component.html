<h1 md-dialog-title>
    {{data.title}}
</h1>

<md-dialog-content [ngSwitch]="data.form">

    <!-- salsah new form for projects, users, resource classes etc.
    all handled by the switch method -->
    <salsah-new-project *ngSwitchCase="'new-project'"></salsah-new-project>

    <salsah-edit-user *ngSwitchCase="'edit-user'" [iri]="data.iri"></salsah-edit-user>

    <salsah-new-user *ngSwitchCase="'new-user'" [iri]="data.iri"></salsah-new-user>

    <salsah-new-resource-class *ngSwitchCase="'new-resource-type'" [iri]="data.iri"></salsah-new-resource-class>


</md-dialog-content>

<md-dialog-actions>

    <button md-button
            md-dialog-close
            class="cancel-button">
        Cancel
    </button>

    <span class="fill-remaining-space"></span>

    <button md-button
            md-dialog-close
            class="submit-button">
        Save
    </button>

</md-dialog-actions>
