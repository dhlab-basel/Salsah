<!-- if an error occurred (from the api), show the error message -->
<salsah-message *ngIf="errorMessage" [message]="errorMessage"></salsah-message>

<!-- variant a) -->
<!-- if ownProfile is not defined; show the users profile defined in the route /user/[username: email] -->
<div class="salsah-module without-header" *ngIf="!showOwnProfile && !errorMessage">
    <salsah-user-profile [user]="userProfile"></salsah-user-profile>
</div>

<!-- variant b) -->
<!-- show the logged in user profile incl. projects list, collections and settings -->
<div class="salsah-module with-header" *ngIf="showOwnProfile && !errorMessage">

    <md-progress-bar mode="indeterminate" *ngIf="isLoading"></md-progress-bar>

    <md-toolbar class="salsah-module-header">
        <md-icon>person</md-icon>
        <h3 md-subheader class="fill-remaining-space">
            Person
        </h3>
        <!-- This fills the remaining space of the current row --
        <span class="fill-remaining-space"></span>
        -->

        <!-- Tab menu -->
        <nav class="salsah-tab-group" *ngIf="!errorMessage">

            <button *ngFor="let item of menu; let i = index; let first = first"
                    md-button
                    class="salsah-tab-item"
                    [routerLink]="item.route"
                    routerLinkActive="active">
                <strong *ngIf="first">{{userProfile.userData.givenName + ' ' + userProfile.userData.familyName}}</strong>
                {{item.name}}
            </button>
        </nav>
        <!-- This fills the remaining space of the current row -->
        <span class="fill-remaining-space"></span>
    </md-toolbar>

    <div class="salsah-module-scroll-area" [ngSwitch]="route">
        <!-- switch view; not with a second router-outlet, because of the direct (parent) routes like
            "/settings", "/projects" and "/collections
        -->
        <salsah-user-projects *ngSwitchCase="'/projects'" [userIri]="userProfile.userData.user_id"></salsah-user-projects>
        <salsah-user-collections *ngSwitchCase="'/collections'" [userIri]="userProfile.userData.user_id"></salsah-user-collections>
        <salsah-user-settings *ngSwitchCase="'/settings'" [user]="userProfile"></salsah-user-settings>
        <salsah-user-profile *ngSwitchCase="'/profile'" [user]="userProfile"></salsah-user-profile>
    </div>
</div>

<!-- variant c) -->
