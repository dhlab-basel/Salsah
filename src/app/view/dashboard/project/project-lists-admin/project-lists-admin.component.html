<div class="salsah-list salsah-module-content" [ngClass]="[position.preview, size]">
    <h2 md-header>Organize your lists</h2>


    <md-list>
        <md-list-item class="salsah-link"
                      (click)="createList()"
                      [class.highlight]="addList">
            <md-icon md-list-avatar>add</md-icon>
            <h4 md-line>Add new list</h4>
            <p md-line>&nbsp;</p>
        </md-list-item>
        <md-divider></md-divider>
        <br/>
        <h2 md-subheader>Lists (project)</h2>

        <md-list-item *ngFor="let pListItem of projectLists; let i = index"
                      (click)="onSelect(pListItem);"
                      class="salsah-link"
                      [class.highlight]="i == selectedRow">
            <h4 md-line>{{pListItem.labels[0].value}}</h4>
            <h6 md-line>{{pListItem.id}}</h6>
        </md-list-item>
        <md-divider></md-divider>
        <br/>
        <h2 md-subheader>Lists (system)</h2>
        <md-list-item *ngFor="let sListItem of systemLists; let i = index"
                      (click)="onSelect(sListItem);"
                      class="salsah-link"
                      [class.highlight]="i == selectedRow">
            <h4 md-line>{{sListItem.labels[0].value}}</h4>
            <h6 md-line>{{sListItem.id}}</h6>
        </md-list-item>
    </md-list>
</div>

<!-- single list operations -->
<div *ngIf="listOp === 'view' || listOp === 'edit' || listOp === 'create'"
     class="salsah-module-detail"
     [ngClass]="position.detail">
    <md-progress-bar mode="indeterminate" *ngIf="isLoadingSubModule"></md-progress-bar>

    <div class="salsah-module-detail-header">
        <!-- close button -->
        <button md-mini-fab (click)="closeDetailView()">
            <md-icon>close</md-icon>
        </button>
    </div>

    <div class="salsah-module-detail-content">
        <!-- if an error occurs: show the error message -->
        <salsah-message *ngIf="errorMessage" [error]="errorMessage"></salsah-message>

        <!-- view selected list -->
        <div class="view-list" *ngIf="!errorMessage">
            <salsah-list-form [listIri]="selectedList.id" [listOp]="listOp"></salsah-list-form>
        </div>
    </div>
</div>
