<div>
    Books:
    <ul>
       <li *ngFor="let book of books" (click)="searchForBook(book.isbn)">
           {{book.title}}
       </li>
    </ul>
</div>

<div>
 Correspondences:
    <br>
    <br>

    <mat-accordion>
        <mat-expansion-panel *ngFor="let corrGroup of correspondenceGroups">

            <mat-expansion-panel-header>
                <mat-panel-title>{{corrGroup.mainCorrespondent.name}} no translations: {{corrGroup.noTranslations}}</mat-panel-title>
            </mat-expansion-panel-header>

            <ul>
                <li *ngFor="let corr of corrGroup.correspondences" (click)="searchForCorrespondence(corr.correspondent1.gnd, corr.correspondent2.gnd, corrGroup.noTranslations)">
                    {{corr.correspondent2.name}}
                </li>
            </ul>
        </mat-expansion-panel>
    </mat-accordion>
</div>
